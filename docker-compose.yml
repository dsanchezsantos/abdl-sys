services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: abdl-sys
        container_name: abdl-sys
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        networks:
            - abdl-sys-network
        ports:
            - "${APP_PORT:-8889}:80"
            - "${VITE_PORT:-5173}:5173"
        depends_on:
            - db
            - redis
            - gotenberg
            - quickchart

    worker:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: abdl-sys
        container_name: abdl-sys-worker
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan horizon
        volumes:
            - ./:/var/www/html
        networks:
            - abdl-sys-network
        depends_on:
            - db
            - redis
            - gotenberg
            - quickchart

    db:
        image: postgres:18
        container_name: abdl-sys-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-laravel}
            POSTGRES_USER: ${DB_USERNAME:-laravel}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - abdl-sys-db-data:/var/lib/postgresql
        networks:
            - abdl-sys-network
        ports:
            - "5432:5432"

    redis:
        image: redis:latest
        container_name: abdl-sys-redis
        restart: unless-stopped
        volumes:
            - abdl-sys-redis-data:/data
        networks:
            - abdl-sys-network
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"

    gotenberg:
        image: gotenberg/gotenberg:8
        container_name: abdl-sys-gotenberg
        restart: unless-stopped
        networks:
            - abdl-sys-network
        command:
            - "gotenberg"
            - "--api-port=3000"
            - "--chromium-disable-javascript=true"
            - "--api-timeout=300s"
            - "--log-level=warn"

    quickchart:
        image: ianw/quickchart
        container_name: abdl-sys-quickchart
        restart: unless-stopped
        networks:
            - abdl-sys-network
        ports:
            - "${QUICKCHART_PORT:-3400}:3400"

    # mailpit:
    #     image: axllent/mailpit
    #     container_name: abdl-sys-mailpit
    #     restart: unless-stopped
    #     networks:
    #         - abdl-sys-network
    #     ports:
    #         - "${FORWARD_MAILPIT_PORT:-8025}:8025"
    #         - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"

networks:
    abdl-sys-network:
        driver: bridge

volumes:
    abdl-sys-db-data:
    abdl-sys-redis-data:
