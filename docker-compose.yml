services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: pmac-starter-kit-app
        container_name: pmac-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        networks:
            - pmac-network
        ports:
            - "${APP_PORT:-8889}:80"
            - "${VITE_PORT:-5173}:5173"
        depends_on:
            - db
            - redis
            - gotenberg
            - mailpit

    db:
        image: postgres:18
        container_name: pmac-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-laravel}
            POSTGRES_USER: ${DB_USERNAME:-laravel}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - pmac-db-data:/var/lib/postgresql
        networks:
            - pmac-network
        ports:
            - "5432:5432"

    redis:
        image: redis:latest
        container_name: pmac-redis
        restart: unless-stopped
        volumes:
            - pmac-redis-data:/data
        networks:
            - pmac-network
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"

    gotenberg:
        image: gotenberg/gotenberg:8
        container_name: pmac-gotenberg
        restart: unless-stopped
        networks:
            - pmac-network
        command:
            - "gotenberg"
            - "--api-port=3000"

    mailpit:
        image: axllent/mailpit
        container_name: pmac-mailpit
        restart: unless-stopped
        networks:
            - pmac-network
        ports:
            - "${FORWARD_MAILPIT_PORT:-8025}:8025"
            - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"

networks:
    pmac-network:
        driver: bridge

volumes:
    pmac-db-data:
    pmac-redis-data:
